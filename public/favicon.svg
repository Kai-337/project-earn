<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="iv-rim" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="iv-chamber" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="iv-bulb" x1="20" y1="15" x2="44" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Outer Octagonal Vault Bezel -->
  <polygon
    points="21,4 43,4 60,21 60,43 43,60 21,60 4,43 4,21"
    fill="url(#iv-rim)"
  />

  <!-- Inner Obsidian Steel Vault Door -->
  <polygon
    points="22.8,8 41.2,8 56,22.8 56,41.2 41.2,56 22.8,56 8,41.2 8,22.8"
    fill="url(#iv-chamber)"
  />

  <!-- Precision Dial Ring -->
  <circle cx="32" cy="31" r="20.5" stroke="#F59E0B" stroke-opacity="0.38" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- 4 Cardinal Vault Locking Bolts -->
  <rect x="30.2" y="6.5" width="3.6" height="5" rx="1.2" fill="#FDE68A" />
  <rect x="30.2" y="52.5" width="3.6" height="5" rx="1.2" fill="#D97706" />
  <rect x="6.5" y="29.2" width="5" height="3.6" rx="1.2" fill="#FBBF24" />
  <rect x="52.5" y="29.2" width="5" height="3.6" rx="1.2" fill="#FBBF24" />

  <!-- Iconic Lightbulb Idea Silhouette Fused With Vault Core -->
  <path
    d="M32 14C24.268 14 18 20.05 18 27.5C18 32.38 20.68 36.64 24.72 38.96C25.62 39.48 26.2 40.42 26.2 41.46V43.2C26.2 44.2 27 45 28 45H36C37 45 37.8 44.2 37.8 43.2V41.46C37.8 40.42 38.38 39.48 39.28 38.96C43.32 36.64 46 32.38 46 27.5C46 20.05 39.732 14 32 14Z"
    fill="url(#iv-bulb)"
  />

  <!-- Bulb Screw Tumbler Ridges -->
  <rect x="27" y="46.8" width="10" height="2.2" rx="1.1" fill="#FBBF24" />
  <rect x="28.8" y="50" width="6.4" height="2" rx="1" fill="#D97706" />

  <!-- Negative-Space Vault Keyhole + Spark Inside the Bulb -->
  <circle cx="32" cy="26.5" r="4.3" fill="#09090B" />
  <path d="M29.8 29.2L28.4 37.5H35.6L34.2 29.2H29.8Z" fill="#09090B" />

  <!-- Brilliant Ivory Idea Spark Core Inside Keyhole -->
  <path
    d="M32 23.7L32.85 25.65L34.8 26.5L32.85 27.35L32 29.3L31.15 27.35L29.2 26.5L31.15 25.65L32 23.7Z"
    fill="#FEF3C7"
  />
</svg>
